<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt Quest ⚔️</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <div class="title-block">
        <span class="game-title">⚔ DEBT QUEST</span>
        <span id="player-title">Squire of Debt</span>
      </div>
      <div class="stats-block">
        <span>XP <strong id="xp-val">0</strong></span>
        <span>PAID $<strong id="paid-val">0.00</strong></span>
        <span>REMAINING $<strong id="remaining-val">17,555.65</strong></span>
      </div>
    </header>

    <!-- FLOOR NAV -->
    <nav id="floor-nav">
      <button class="floor-btn active" data-floor="1">F1: GOBLIN WARREN</button>
      <button class="floor-btn" data-floor="2">F2: IMP LAIR</button>
      <button class="floor-btn" data-floor="3">F3: TROLL BRIDGE</button>
    </nav>

    <!-- BATTLE ARENA -->
    <div id="battle-arena">

      <!-- Hero side -->
      <div id="hero-panel">
        <div id="hero-sprite"></div>
        <div id="hero-name">SPRITE</div>
        <div id="hero-gear">Cloth Armor | Wooden Sword</div>
        <div id="xp-bar-wrap">
          <div id="xp-bar-track"><div id="xp-bar"></div></div>
          <span id="xp-bar-label">0 / 100 XP</span>
        </div>
      </div>

      <!-- VS -->
      <div id="vs-col">
        <div id="vs-text">VS</div>
      </div>

      <!-- Enemy side -->
      <div id="enemy-panel">
        <div id="enemy-sprite"></div>
        <div id="enemy-name">—</div>
        <div id="enemy-hp-wrap">
          <div id="enemy-hp-track"><div id="enemy-hp-bar"></div></div>
          <div id="enemy-hp-text">select an enemy</div>
        </div>
        <div id="enemy-taunt" class="taunt-box">"..."</div>
      </div>

    </div>

    <!-- ENEMY ROSTER -->
    <div id="enemy-roster"></div>

  </div>
  <script src="game.js"></script>
</body>
</html>
