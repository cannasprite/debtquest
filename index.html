<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt Quest ⚔️</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <div class="title-block">
        <span class="game-title">⚔ DEBT QUEST</span>
        <span id="player-title">Squire of Debt</span>
      </div>
      <div class="stats-block">
        <span>XP <strong id="xp-val">0</strong></span>
        <span>PAID $<strong id="paid-val">0.00</strong></span>
      </div>
    </header>

    <section id="hero-section">
      <div id="hero-sprite"></div>
      <div id="hero-info">
        <div id="hero-name">SPRITE THE DEBT SLAYER</div>
        <div id="hero-gear-label">GEAR</div>
        <div id="hero-gear">Cloth Armor | Wooden Sword</div>
        <div id="xp-bar-wrap">
          <div id="xp-bar"></div>
          <span id="xp-bar-label">0 / 100 XP</span>
        </div>
      </div>
    </section>

  </div>
  <script src="game.js"></script>
</body>
</html>
